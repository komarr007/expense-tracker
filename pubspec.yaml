name: the_money_logger
description: "Personal money logger — track expenses, income, budgets, and financial health."
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  sqflite: ^2.0.0+4
  path_provider: ^2.0.11
  intl: ^0.20.1
  fluttertoast: ^9.0.0
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  excel: ^4.0.6
  flutter_local_notifications: ^17.2.3
  cupertino_icons: ^1.0.8
  logger: ^2.5.0
  path: ^1.9.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.1"
  mockito: ^5.4.4
  build_runner: ^2.4.13

  sqflite_common: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/icon.png
