org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation writes cross-drive relative paths on Windows
# when the project (D:) and the Pub cache (C:) are on different drives, which
# causes an IllegalArgumentException in RelocatableFileToPathConverter.
kotlin.incremental=false
